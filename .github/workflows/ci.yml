# CI — lint, typecheck/build, unit + component tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint · Build · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production build)
        run: npm run build

      - name: Unit + component tests
        run: npm test

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit (all deps, high+)
        run: npm audit --audit-level=high || true
