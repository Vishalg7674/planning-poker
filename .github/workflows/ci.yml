# CI — lint, typecheck/build, unit tests, socket-level E2E, browser E2E.
# Phase 0 (optimization.md, T6): every push/PR to main must be green before
# deploy. The socket-level suites start their own realtime server with
# RATE_LIMIT_DISABLED=1 (they create many rooms per run from one IP — the
# limiter itself is unit-tested instead).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint · Build · Unit · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production build)
        run: npm run build

      - name: Unit + component tests
        run: npm test

      - name: Socket-level E2E (realtime protocol + engine games)
        run: |
          RATE_LIMIT_DISABLED=1 SOCKET_PORT=3001 node server/index.mjs &
          SERVER_PID=$!
          # wait for the banner to appear
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/ > /dev/null 2>&1 && break
            sleep 0.5
          done
          node scripts/e2e.mjs
          node scripts/e2e-games.mjs
          kill $SERVER_PID || true

      - name: Playwright browser E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit (all deps, high+)
        run: npm audit --audit-level=high || true
